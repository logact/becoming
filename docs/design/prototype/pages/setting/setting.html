<!DOCTYPE html>
<html lang="en">
<head>

<title>Becoming — Setting</title>
<link rel="stylesheet" href="../shared/prototype.css">
</head>
<body>
<main class="board" id="board"></main>
<script>
const PAGE_TITLE = 'Setting';
const SCREEN = () =>
statusBar() +
  '<div class="scroll">' +

    '<div class="panel">' +
      '<div class="row"><span class="chip lg">' + ic('person', 24) + '</span>' +

    '</div>' +

    sec('Appearance') +

      '<div class="row press"><span class="chip">' + ic('archive', 17) + '</span>' +
        '<div class="row-main"><div class="row-title">Archive</div></div>' + CHEV + '</div>' +
    '</div>' +

    sec('About') +
    '<div class="panel">' +
      '<div class="row"><div class="row-main"><div class="row-title">Version</div></div><span class="value">0.1.0</span></div>' +

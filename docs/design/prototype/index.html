<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Becoming — iOS Prototype</title>
<style>
  :root{
    --bg:#F4F1E8;            /* warm cream */
    --panel:#FBFAF4;         /* container cream */
    --line:#E4E1D2;          /* hairline */
    --track:#EAE7DB;         /* segmented / search track */
    --ink:#1B2821;           /* near-black green text */
    --muted:#79837A;         /* secondary text */
    --faint:#9AA398;         /* tertiary text */
    --green:#1F3D2D;         /* deep forest green */
    --mint:#DAE8DD;          /* icon chip fill */
    --sage:#3F7A54;          /* done / positive */
    --blue:#3E6FB4;
    --amber:#9A6B1F;
    --red:#B4493F;
    --grayp:#6E7670;
    --serif:ui-serif,"New York",Georgia,"Times New Roman",serif;
    --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{font-family:var(--sans);background:#ECE9DD;color:var(--ink)}

  /* ---------- board ---------- */
  .board-header{text-align:center;padding:60px 20px 6px}
  .board-header h1{font-family:var(--serif);font-size:42px;font-weight:700;letter-spacing:-.5px;color:var(--green)}
  .board-header .tagline{margin-top:8px;font-family:var(--serif);font-style:italic;font-size:16px;color:var(--muted)}
  .board-header .hint{margin-top:14px;font-size:12.5px;color:var(--faint);line-height:1.6}
  .board{display:flex;flex-wrap:wrap;gap:64px 44px;justify-content:center;align-items:flex-start;padding:48px 24px 96px}
  .phone-wrap{display:flex;flex-direction:column;align-items:center;gap:16px}
  .phone-wrap figcaption{font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:#8B8C7E}

  /* ---------- phone frame ---------- */
  .phone{
    position:relative;width:393px;height:852px;flex:none;
    background:var(--bg);border:11px solid #17281E;border-radius:56px;overflow:hidden;
    box-shadow:0 0 0 2px #2E4A39,0 34px 70px -22px rgba(23,40,30,.45);
    user-select:none;-webkit-user-select:none;
  }
  .island{position:absolute;top:12px;left:50%;transform:translateX(-50%);width:122px;height:34px;border-radius:20px;background:#12211A;z-index:60;pointer-events:none}
  .home{position:absolute;bottom:7px;left:50%;transform:translateX(-50%);width:134px;height:5px;border-radius:3px;background:var(--ink);opacity:.85;z-index:60;pointer-events:none}

  .screen{position:absolute;inset:0;display:none;flex-direction:column;background:var(--bg)}
  .screen.active{display:flex}
  .scroll{flex:1;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding-bottom:30px}
  .scroll::-webkit-scrollbar{display:none}

  /* ---------- status bar ---------- */
  .statusbar{flex:none;height:56px;display:flex;align-items:center;justify-content:space-between;padding:12px 30px 0;font-size:15px;font-weight:600;position:relative;z-index:30}
  .sb-dots{display:flex;gap:7px;align-items:center}
  .sb-dots i{width:7px;height:7px;border-radius:50%;background:var(--ink);display:block}

  /* ---------- navigation ---------- */
  .nav-large{flex:none;padding:10px 22px 12px}
  .nav-large h1{font-family:var(--serif);font-size:35px;font-weight:700;letter-spacing:-.5px}
  .eyebrow{font-size:11.5px;font-weight:700;color:var(--faint);text-transform:uppercase;letter-spacing:.16em;margin-bottom:5px}

  .nav-inline{flex:none;display:flex;align-items:center;height:56px;padding:0 14px;position:relative}
  .nav-back{width:38px;height:38px;display:grid;place-items:center;color:var(--green);background:none;border:0;cursor:pointer;border-radius:50%}
  .nav-back svg{width:12px;height:20px}
  .nav-title{position:absolute;left:70px;right:70px;text-align:center;font-family:var(--serif);font-size:20px;font-weight:700;pointer-events:none}
  .nav-right{margin-left:auto;display:flex;align-items:center}
  .nav-btn{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:var(--green);background:none;border:0;cursor:pointer}
  .nav-btn svg{width:19px;height:19px}

  /* ---------- tab bar ---------- */
  .tabbar{flex:none;display:flex;background:#F7F5EC;border-top:1px solid var(--line);padding:10px 0 24px;position:relative;z-index:20}
  .tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--faint);font-size:10.5px;font-weight:600;background:none;border:0;font-family:inherit;cursor:pointer;letter-spacing:.02em}
  .tab-ic{width:46px;height:30px;border-radius:11px;display:grid;place-items:center;transition:background .15s}
  .tab-ic svg{width:22px;height:22px}
  .tab.active{color:var(--green)}
  .tab.active .tab-ic{background:var(--mint)}

  /* ---------- shared blocks ---------- */
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:22px;margin:0 18px;overflow:hidden}
  .blist{margin:0 4px}
  .row{display:flex;align-items:center;gap:13px;padding:15px 20px;min-height:52px;position:relative}
  .blist .row + .row::before{content:"";position:absolute;top:0;left:22px;right:22px;height:1px;background:var(--line)}
  .panel .row{padding:14px 18px}
  .panel .row + .row::before{content:"";position:absolute;top:0;left:18px;right:18px;height:1px;background:var(--line)}
  .row-main{flex:1;min-width:0}
  .row-title{font-size:16.5px;font-weight:700;letter-spacing:-.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .row-sub{font-size:13px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .row-meta{font-size:12.5px;color:var(--faint);flex:none;font-weight:500}
  .chev{color:#B7BCAF;flex:none;display:grid;place-items:center}
  .chev svg{width:9px;height:15px}
  .press{cursor:pointer;transition:opacity .15s}
  .press:active{opacity:.5}

  .chip{width:32px;height:32px;border-radius:10px;background:var(--mint);color:var(--green);display:grid;place-items:center;flex:none}
  .chip svg{width:17px;height:17px}
  .chip.lg{width:46px;height:46px;border-radius:14px}
  .chip.lg svg{width:24px;height:24px}

  .sec-head{margin:26px 24px 10px}
  .sec-head h2{font-size:12px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
  .sec-note{margin:10px 26px 0;font-size:12.5px;color:var(--faint);line-height:1.5}

  /* outlined status pills, per reference */
  .pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:4px 11px;border-radius:999px;border:1.5px solid currentColor;background:transparent;flex:none;letter-spacing:.01em}
  .pill svg{width:11px;height:11px}
  .pill.doing,.pill.exploring{color:var(--blue)}
  .pill.todo,.pill.captured{color:var(--grayp)}
  .pill.done,.pill.active{color:var(--sage)}
  .pill.paused,.pill.planning,.pill.blocked{color:var(--amber)}
  .pill.conflict{color:var(--red)}

  .tag{font-size:11.5px;font-weight:600;padding:4px 10px;border-radius:999px;border:1px solid var(--line);color:var(--muted);background:var(--panel)}

  .progress{height:5px;border-radius:3px;background:#E3E0D1;overflow:hidden;margin-top:9px}
  .progress i{display:block;height:100%;border-radius:3px;background:var(--green)}
  .progress.green i{background:var(--sage)}

  .chip-btn{flex:none;border:0;background:var(--green);color:#F2F0E6;font-family:inherit;font-size:12.5px;font-weight:700;padding:7px 15px;border-radius:999px;cursor:pointer;letter-spacing:.01em}

  /* ---------- dashboard ---------- */
  .stats{display:flex;gap:10px;margin:6px 18px 0}
  .stat{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:13px 14px 11px}
  .stat-num{font-family:var(--serif);font-size:24px;font-weight:700;color:var(--green)}
  .stat-label{font-size:11px;color:var(--muted);margin-top:3px;font-weight:600;letter-spacing:.03em}

  /* ---------- library ---------- */
  .search{margin:2px 18px 8px;background:var(--track);border-radius:999px;display:flex;align-items:center;gap:7px;padding:9px 14px;color:var(--muted);font-size:15px}
  .search svg{width:15px;height:15px}
  .count{color:var(--faint);font-size:15px;flex:none;font-weight:500}
  .slogan{margin:28px 16px 10px;text-align:center;font-family:var(--serif);font-style:italic;font-size:15px;color:var(--faint)}

  /* ---------- goals ---------- */
  .segmented{display:flex;background:var(--track);border-radius:16px;padding:3px;margin:14px 18px 16px}
  .seg{flex:1;border:0;background:transparent;font-family:inherit;font-size:14px;font-weight:600;padding:8px 0;border-radius:13px;color:var(--muted);cursor:pointer}
  .seg.active{background:#FFFFFF;box-shadow:0 2px 6px rgba(27,40,33,.14);color:var(--ink);font-weight:700}
  .hidden{display:none!important}

  .goal-card{background:var(--panel);border:1px solid var(--line);border-radius:22px;margin:0 18px 12px;padding:16px 18px}
  .goal-top{display:flex;align-items:center;gap:11px}
  .goal-name{flex:1;font-size:17px;font-weight:700;letter-spacing:-.2px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .goal-sub{font-size:13px;color:var(--muted);margin-top:9px}
  .goal-foot{display:flex;align-items:center;gap:7px;margin-top:10px}
  .goal-foot .row-meta{margin-right:auto}

  /* ---------- goal detail ---------- */
  .gd{background:var(--panel);border:1px solid var(--line);border-radius:22px;margin:0 18px;padding:18px}
  .gd h1{font-family:var(--serif);font-size:25px;font-weight:700;margin:14px 0 9px;letter-spacing:-.4px}
  .gd-meta{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
  .gd-meta .dot{color:var(--faint);font-size:11px}
  .gd-target{font-size:12.5px;color:var(--muted)}
  .gd-progress-label{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);margin-top:11px}
  .gd-progress-label b{color:var(--ink);font-size:13px}

  /* task checkboxes: mint rounded-square chips, per reference */
  .check{width:32px;height:32px;border-radius:10px;flex:none;display:grid;place-items:center;border:1.6px solid #C9CDBC;color:var(--green);background:transparent}
  .check svg{width:15px;height:15px}
  .check.done{background:var(--mint);border-color:var(--mint)}
  .check.doing{border-color:var(--green)}
  .check.doing::after{content:"";width:10px;height:10px;border-radius:4px;background:var(--green)}
  .t-done .row-title{color:var(--faint);text-decoration:line-through;font-weight:600}

  .add-row{color:var(--green);font-size:15.5px;font-weight:700;display:flex;align-items:center;gap:13px}
  .add-row .plus-c{width:32px;height:32px;border-radius:10px;background:var(--mint);display:grid;place-items:center}
  .add-row svg{width:15px;height:15px}

  /* ---------- ideas ---------- */
  .capture{display:flex;align-items:center;gap:11px;padding:14px 16px;color:var(--faint);font-size:15.5px}
  .capture .chip-btn{margin-left:auto}
  .capture .plus-c{width:30px;height:30px;border-radius:9px;background:var(--mint);color:var(--green);display:grid;place-items:center}
  .capture svg{width:15px;height:15px}

  /* ---------- setting ---------- */
  .switch{width:50px;height:30px;border-radius:999px;background:#DCD9C9;position:relative;flex:none;transition:background .2s}
  .switch::after{content:"";position:absolute;top:2px;left:2px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 2px 5px rgba(27,40,33,.28)}
  .switch.on{background:var(--green)}
  .switch.on::after{left:22px}
  .value{color:var(--muted);font-size:15px;flex:none}
  .swatch{width:18px;height:18px;border-radius:50%;background:var(--green);flex:none;border:2px solid #fff;box-shadow:0 0 0 1px var(--line)}
</style>
</head>
<body>

<header class="board-header">
  <h1>Becoming</h1>
  <p class="tagline">Record what you do. Shape what you become.</p>
  <p class="hint">iOS prototype · v0.2 — every frame is interactive: tap the tabs, list rows, segmented controls and back buttons.<br>
  Flow: Library → Goals → Goal detail &nbsp;·&nbsp; Library → Ideas &nbsp;·&nbsp; Dashboard ⇄ Library ⇄ Setting</p>
</header>

<main class="board" id="board"></main>

<script>
/* ================= icons (line icons, deep green on mint) ================= */
const P = {
  grid:'<rect x="3.5" y="3.5" width="7" height="7" rx="2"/><rect x="13.5" y="3.5" width="7" height="7" rx="2"/><rect x="3.5" y="13.5" width="7" height="7" rx="2"/><rect x="13.5" y="13.5" width="7" height="7" rx="2"/>',
  folder:'<path d="M3.5 7.2c0-1 .8-1.9 1.9-1.9h3.4l1.9 2.1h8.4c1 0 1.9.8 1.9 1.9v7.4c0 1-.8 1.9-1.9 1.9H5.4c-1 0-1.9-.8-1.9-1.9Z"/>',
  target:'<circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="4.8"/><circle cx="12" cy="12" r="1.4" fill="currentColor" stroke="none"/>',
  checkCircle:'<circle cx="12" cy="12" r="8.5"/><path d="M8.2 12.4l2.5 2.5 5.1-5.6"/>',
  check:'<path d="M5.5 12.5l4.3 4.3L18.5 7.5"/>',
  box:'<path d="M12 3.2 20.6 7.4v9.2L12 20.8 3.4 16.6V7.4Z"/><path d="M3.4 7.4 12 11.6l8.6-4.2M12 11.6v9.2"/>',
  bulb:'<path d="M12 3.5a5.8 5.8 0 0 1 3.4 10.5c-.6.5-.9 1.2-.9 2h-5c0-.8-.3-1.5-.9-2A5.8 5.8 0 0 1 12 3.5Z"/><path d="M9.8 19.2h4.4M10.6 21.4h2.8"/>',
  doc:'<path d="M6.5 3.5h7l4 4v13h-11Z"/><path d="M13.2 3.8V7.8h4"/><path d="M9.3 12.4h5.4M9.3 15.6h5.4"/>',
  banknote:'<rect x="3" y="7" width="18" height="10" rx="2.2"/><circle cx="12" cy="12" r="2.4"/><path d="M6.5 10v4M17.5 10v4"/>',
  tag:'<path d="M3.5 3.5h7l10 10-7 7-10-10Z"/><circle cx="8" cy="8" r="1.3" fill="currentColor" stroke="none"/>',
  clock:'<circle cx="12" cy="12" r="8.5"/><path d="M12 7v5.2l3.4 2"/>',
  sparkle:'<path d="M12 3.5c.7 4.3 2.2 5.8 6.5 6.5-4.3.7-5.8 2.2-6.5 6.5-.7-4.3-2.2-5.8-6.5-6.5 4.3-.7 5.8-2.2 6.5-6.5Z"/>',
  chevron:'<path d="M9.2 5.2 16 12l-6.8 6.8"/>',
  back:'<path d="M14.8 5.2 8 12l6.8 6.8"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  minus:'<path d="M5 12h14"/>',
  pencil:'<path d="M4.5 19.5h4L19.8 8.2a2.2 2.2 0 0 0-4-4L4.5 15.5Z"/><path d="M13.5 6.5l4 4"/>',
  arrowUpRight:'<path d="M7 17 17 7M9.5 7H17v7.5"/>',
  alert:'<circle cx="12" cy="12" r="8.5"/><path d="M12 7.4v5.4"/><circle cx="12" cy="16.5" r="1.05" fill="currentColor" stroke="none"/>',
  pauseCircle:'<circle cx="12" cy="12" r="8.5"/><path d="M9.7 8.8v6.4M14.3 8.8v6.4"/>',
  pause:'<path d="M9.5 7.5v9M14.5 7.5v9"/>',
  circle:'<circle cx="12" cy="12" r="8.5"/>',
  play:'<path d="M8.5 6.8v10.4L17.8 12Z"/>',
  search:'<circle cx="11" cy="11" r="6.2"/><path d="M15.8 15.8 20 20"/>',
  list:'<path d="M9.4 6h10.6M9.4 12h10.6M9.4 18h10.6"/><circle cx="4.7" cy="6" r="1.15" fill="currentColor" stroke="none"/><circle cx="4.7" cy="12" r="1.15" fill="currentColor" stroke="none"/><circle cx="4.7" cy="18" r="1.15" fill="currentColor" stroke="none"/>',
  person:'<circle cx="12" cy="8" r="3.6"/><path d="M5 20c.8-3.4 3.6-5.2 7-5.2s6.2 1.8 7 5.2"/>',
  moon:'<path d="M19.5 14.4A8 8 0 1 1 9.6 4.5a6.6 6.6 0 0 0 9.9 9.9Z"/>',
  share:'<path d="M12 15.5V4M8.2 7.6 12 3.8l3.8 3.8"/><path d="M5 12.5v7h14v-7"/>',
  archive:'<rect x="3.5" y="4" width="17" height="4.4" rx="1.2"/><path d="M5 8.4v10.1h14V8.4M9.8 12.2h4.4"/>',
  bell:'<path d="M12 4a5.5 5.5 0 0 1 5.5 5.5c0 4 1.5 5.5 1.5 5.5H5s1.5-1.5 1.5-5.5A5.5 5.5 0 0 1 12 4Z"/><path d="M10 18.5a2 2 0 0 0 4 0"/>',
  cloud:'<path d="M7 18.5a4.5 4.5 0 0 1-.4-9A6 6 0 0 1 18.2 11a3.8 3.8 0 0 1-.7 7.5Z"/>'
};
let gear = '<circle cx="12" cy="12" r="3.1"/>';
for (let i = 0; i < 8; i++) gear += '<rect x="11.15" y="2.5" width="1.7" height="4.4" rx=".85" transform="rotate(' + (i*45) + ' 12 12)"/>';
gear += '<circle cx="12" cy="12" r="7.4"/>';
P.gear = gear;

function ic(name, size = 20) {
  return '<svg width="' + size + '" height="' + size + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">' + P[name] + '</svg>';
}

/* ================= shared chrome ================= */
function statusbar() {
  return '<div class="statusbar"><span>9:41</span><span class="sb-dots"><i></i><i></i><i></i></span></div>';
}
function tabbar(active) {
  // app tabs per design doc: Dashboard / Library / Setting
  const tabs = [['dashboard','grid','Dashboard'],['library','folder','Library'],['setting','gear','Setting']];
  return '<nav class="tabbar">' + tabs.map(t =>
    '<button class="tab' + (t[0] === active ? ' active' : '') + '" data-root="' + t[0] + '">' +
    '<span class="tab-ic">' + ic(t[1], 22) + '</span><span>' + t[2] + '</span></button>'
  ).join('') + '</nav>';
}
function inlineNav(title, rightIcon) {
  return '<div class="nav-inline">' +
    '<button class="nav-back press" data-back>' + ic('back', 12) + '</button>' +
    '<div class="nav-title">' + title + '</div>' +
    (rightIcon ? '<div class="nav-right"><button class="nav-btn press">' + ic(rightIcon, 19) + '</button></div>' : '') +
  '</div>';
}
function sec(title) {
  return '<div class="sec-head"><h2>' + title + '</h2></div>';
}
function activityPanel(rows) {
  return '<div class="panel">' + rows.map(r =>
    '<div class="row"><span class="chip">' + ic(r.i, 17) + '</span>' +
    '<div class="row-main"><div class="row-title">' + r.t + '</div><div class="row-sub">' + r.s + '</div></div>' +
    '<span class="row-meta">' + r.w + '</span></div>'
  ).join('') + '</div>';
}
const CHEV = '<span class="chev">' + ic('chevron', 9) + '</span>';

/* ================= screens ================= */
const SCREENS = {

  dashboard: () => statusbar() +
  '<div class="scroll">' +
    '<div class="nav-large"><div class="eyebrow">Tuesday, August 18</div><h1>Today</h1></div>' +

    '<div class="stats">' +
      '<div class="stat"><div class="stat-num">3</div><div class="stat-label">Doing now</div></div>' +
      '<div class="stat"><div class="stat-num">12</div><div class="stat-label">Done · 7 days</div></div>' +
      '<div class="stat"><div class="stat-num">6.5 h</div><div class="stat-label">Focus time</div></div>' +
    '</div>' +

    sec('Doing now') +
    '<div class="blist">' +
      '<div class="row press" data-go="goal-detail"><span class="chip">' + ic('checkCircle', 17) + '</span>' +
        '<div class="row-main"><div class="row-title">Intervals 6 × 800 m</div><div class="row-sub">Run a half marathon · Spring training plan</div>' +
        '<div class="progress"><i style="width:65%"></i></div></div><span class="row-meta">40:12</span></div>' +
      '<div class="row press"><span class="chip">' + ic('checkCircle', 17) + '</span>' +
        '<div class="row-main"><div class="row-title">Wire goal detail screen</div><div class="row-sub">Ship Becoming MVP · v0.1 build</div>' +
        '<div class="progress"><i style="width:30%"></i></div></div><span class="row-meta">1:20</span></div>' +
      '<div class="row press"><span class="chip">' + ic('checkCircle', 17) + '</span>' +
        '<div class="row-main"><div class="row-title">Read chapter 7 — Atomic Habits</div><div class="row-sub">Read 12 books in 2026</div>' +
        '<div class="progress green"><i style="width:80%"></i></div></div><span class="row-meta">25 m</span></div>' +
    '</div>' +

    sec('Needs attention') +
    '<div class="blist">' +
      '<div class="row press" data-go="goals"><span class="chip">' + ic('pauseCircle', 17) + '</span>' +
        '<div class="row-main"><div class="row-title">Learn Japanese N3</div><div class="row-sub">Paused · no activity for 3 weeks</div></div>' +
        '<button class="chip-btn">Resume</button></div>' +
      '<div class="row press" data-go="goals"><span class="chip">' + ic('alert', 17) + '</span>' +
        '<div class="row-main"><div class="row-title">Ship Becoming MVP</div><div class="row-sub">No tasks planned this week</div></div>' +

/* ================= build the board ================= */
const PHONES = [
  ['dashboard',   '01 · Dashboard'],
  ['library',     '02 · Library'],
  ['goals',       '03 · Goals'],
  ['goal-detail', '04 · Goal detail'],
  ['ideas',       '05 · Ideas'],
  ['setting',     '06 · Setting'],
];

const board = document.getElementById('board');
PHONES.forEach(([start, caption]) => {
  const wrap = document.createElement('figure');
  wrap.className = 'phone-wrap';
  const phone = document.createElement('div');
  phone.className = 'phone';
  phone.dataset.stack = start;
  phone.innerHTML =
    Object.keys(SCREENS).map(id =>
      '<section class="screen' + (id === start ? ' active' : '') + '" data-screen="' + id + '">' + SCREENS[id]() + '</section>'
    ).join('') +
    '<div class="island"></div><div class="home"></div>';
  const cap = document.createElement('figcaption');
  cap.textContent = caption;
  wrap.appendChild(phone);
  wrap.appendChild(cap);
  board.appendChild(wrap);
});

/* ================= interactions ================= */
function show(phone, id) {
  phone.querySelectorAll('.screen').forEach(s => {
    const on = s.dataset.screen === id;
    s.classList.toggle('active', on);
    if (on) { const sc = s.querySelector('.scroll'); if (sc) sc.scrollTop = 0; }
  });
}
function stack(phone) { return phone.dataset.stack.split(','); }

document.addEventListener('click', e => {
  const root = e.target.closest('[data-root]');
  if (root) {
    const phone = root.closest('.phone');
    phone.dataset.stack = root.dataset.root;
    show(phone, root.dataset.root);
    return;
  }
  const back = e.target.closest('[data-back]');
  if (back) {
    const phone = back.closest('.phone');
    const st = stack(phone);
    if (st.length > 1) { st.pop(); phone.dataset.stack = st.join(','); show(phone, st[st.length - 1]); }
    return;
  }
  const segBtn = e.target.closest('[data-seg]');
  if (segBtn) {
    const wrap = segBtn.closest('.segmented');
    wrap.querySelectorAll('[data-seg]').forEach(b => b.classList.toggle('active', b === segBtn));
    const screen = segBtn.closest('.screen');
    screen.querySelectorAll('[data-panel]').forEach(p => p.classList.toggle('hidden', p.dataset.panel !== segBtn.dataset.seg));
    return;
  }
  const go = e.target.closest('[data-go]');
  if (go) {
    const phone = go.closest('.phone');
    const st = stack(phone);
    st.push(go.dataset.go);
    phone.dataset.stack = st.join(',');
    show(phone, go.dataset.go);
  }
});

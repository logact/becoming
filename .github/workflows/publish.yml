name: Publish iOS

on:
  workflow_dispatch:
    inputs:
      destination:
        description: Publish destination
        required: true
        type: choice
        options:
          - testflight
          - appstore

permissions:
  contents: read

concurrency:
  group: publish-ios
  cancel-in-progress: false

env:
  EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

jobs:
  build-and-submit:
    name: Build and submit to App Store Connect
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Restrict publishing to main
        if: github.ref_name != 'main'
        run: |
          echo "::error::iOS publishing is only allowed from the main branch."
          exit 1

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate publishing configuration
        env:
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          APPLE_TEAM_TYPE: ${{ vars.APPLE_TEAM_TYPE }}
          ASC_APP_ID: ${{ vars.ASC_APP_ID }}
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
        shell: bash
        run: |
          set -euo pipefail
          : "${ASC_API_KEY_P8:?Set the ASC_API_KEY_P8 repository secret}"
          : "${APPLE_TEAM_ID:?Set the APPLE_TEAM_ID repository variable}"
          : "${APPLE_TEAM_TYPE:?Set the APPLE_TEAM_TYPE repository variable}"
          : "${ASC_APP_ID:?Set the ASC_APP_ID repository variable to the numeric Apple ID from App Store Connect}"
          case "$APPLE_TEAM_TYPE" in
            INDIVIDUAL|COMPANY_OR_ORGANIZATION|IN_HOUSE) ;;
            *) echo "::error::APPLE_TEAM_TYPE must be INDIVIDUAL, COMPANY_OR_ORGANIZATION, or IN_HOUSE"; exit 1 ;;
          esac
          if [[ ! "$ASC_APP_ID" =~ ^[0-9]+$ ]]; then
            echo "::error::ASC_APP_ID must be the numeric Apple ID shown under App Store Connect > App Information"
            exit 1
          fi
          jq -er '.submit.production.ios.ascApiKeyIssuerId | select(length > 0)' eas.json > /dev/null
          jq -er '.submit.production.ios.ascApiKeyId | select(length > 0)' eas.json > /dev/null
          configured_eas_json="$(mktemp)"
          jq --arg asc_app_id "$ASC_APP_ID" \
            '.submit.production.ios.ascAppId = $asc_app_id' \
            eas.json > "$configured_eas_json"
          mv "$configured_eas_json" eas.json

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run domain and persistence tests
        run: npm test -- --ci

      - name: Write App Store Connect API key
        env:
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .asc
          printf '%s' "$ASC_API_KEY_P8" | base64 --decode > .asc/app-store-connect.p8
          grep -q -- '-----BEGIN PRIVATE KEY-----' .asc/app-store-connect.p8

      - name: Build iOS app with EAS
        env:
          EXPO_ASC_API_KEY_PATH: .asc/app-store-connect.p8
          EXPO_APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          EXPO_APPLE_TEAM_TYPE: ${{ vars.APPLE_TEAM_TYPE }}
        shell: bash
        run: |
          set -euo pipefail
          export EXPO_ASC_ISSUER_ID="$(jq -er .submit.production.ios.ascApiKeyIssuerId eas.json)"
          export EXPO_ASC_KEY_ID="$(jq -er .submit.production.ios.ascApiKeyId eas.json)"
          npx --yes eas-cli@21.8.0 build --platform ios --profile production --non-interactive --wait

      - name: Submit build to App Store Connect
        run: npx --yes eas-cli@21.8.0 submit --platform ios --profile production --latest --non-interactive

  appstore-review:
    name: Submit for App Store review
    if: inputs.destination == 'appstore'
    needs:
      - build-and-submit
    runs-on: macos-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Write App Store Connect API key
        env:
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
        shell: bash
        run: |
          set -euo pipefail
          : "${ASC_API_KEY_P8:?Set the ASC_API_KEY_P8 repository secret}"
          mkdir -p .asc
          printf '%s' "$ASC_API_KEY_P8" | base64 --decode > .asc/app-store-connect.p8
          grep -q -- '-----BEGIN PRIVATE KEY-----' .asc/app-store-connect.p8
          jq -n \
            --arg key_id "$(jq -r .submit.production.ios.ascApiKeyId eas.json)" \
            --arg issuer_id "$(jq -r .submit.production.ios.ascApiKeyIssuerId eas.json)" \
            --rawfile key .asc/app-store-connect.p8 \
            '{key_id: $key_id, issuer_id: $issuer_id, key: $key, in_house: false}' \
            > .asc/api-key.json

      - name: Submit build for App Store review
        shell: bash
        run: |
          set -euo pipefail
          fastlane deliver submit_build \
            --app_identifier com.logact.becoming \
            --api_key_path .asc/api-key.json \
            --app_version "$(jq -r .expo.version app.json)" \
            --build_number latest \
            --skip_binary_upload true \
            --skip_metadata true \
            --skip_screenshots true \
            --automatic_release false \
            --force true

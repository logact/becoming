name: CI/CD

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pipeline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  quality:
    name: Validate repository
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check required project documentation
        shell: bash
        run: |
          set -euo pipefail

          required_files=(
            AGENTS.md
            Table-definetion.txt
          )

          for file in "${required_files[@]}"; do
            if [[ ! -s "$file" ]]; then
              echo "::error file=$file::Required project document is missing or empty."
              exit 1
            fi
          done

      - name: Detect unresolved merge conflicts
        shell: bash
        run: |
          set -euo pipefail

          if git grep --line-number --extended-regexp \
            '^(<<<<<<< .+|=======|>>>>>>> .+)$' -- .; then
            echo "::error::Unresolved merge-conflict markers were found."
            exit 1
          fi

      - name: Lint Markdown
        run: npx --yes markdownlint-cli2@0.20.0 "**/*.md"

      - name: Lint GitHub Actions workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

      - name: Validate release tag
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          set -euo pipefail

          semver='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'
          if [[ ! "$GITHUB_REF_NAME" =~ $semver ]]; then
            echo "::error::Release tags must use SemVer, for example v1.2.3."
            exit 1
          fi

          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Release tags must point to a commit contained in main."
            exit 1
          fi

  domain:
    name: Domain and persistence checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run domain and persistence tests
        run: npm test -- --ci

  release:
    name: Publish GitHub release
    if: github.ref_type == 'tag'
    needs:
      - quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Publish release with generated notes
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          if gh release view "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; nothing to publish."
            exit 0
          fi

          release_options=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            release_options+=(--prerelease)
          fi

          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --generate-notes \
            "${release_options[@]}"
